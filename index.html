<script>
'use strict';
const KEY='sc_rodrigo_v2';
const AREAS=['Trabajo','Casa','Familia','Pareja','Ser papá','Personal','Ocio','Viajes','Ser hijo'];
const DAYMS=864e5;
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const WDN=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DTN={wd:'Día de trabajo (lunes a viernes)',satW:'Sábado con trabajo',satF:'Sábado libre',sun:'Domingo'};
const NOW=()=>new Date();
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
/* El día termina a las 3:00 a. m.: lo que hagas pasada la medianoche cuenta para el día anterior */
const today=()=>dstr(new Date(NOW().getTime()-3*36e5));
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const toMin=t=>{const a=String(t).split(':');return (+a[0])*60+(+a[1])};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const fromStr=s=>new Date(s+'T00:00:00');
const addDays=(s,n)=>{const d=fromStr(s);d.setDate(d.getDate()+n);return dstr(d)};
const daysBetween=(a,b)=>Math.round((fromStr(b)-fromStr(a))/DAYMS);
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+pad(m):m)+':'+pad(x)};
const fmtMin=s=>Math.round(s/60)+' min';
const ymd=s=>{const d=fromStr(s);return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)};

function blank(){return {v:2,created:Date.now(),items:[],projects:[],logs:{},hOver:{},custom:[],satWork:{},fired:{},weekly:[],reviews:{},lastBackup:0,settings:{cont:false,sound:true},outing:'',notes:'',vacations:{},ciclo:0,pend:{},top3v2:null,top3log:[]}}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&o.items){const b=blank();Object.assign(b,o);b.settings=Object.assign(blank().settings,o.settings||{});return b}}catch(e){}return blank()}
let db=load();
const ui={tab:'hoy',area:'',filter:'activas',pr:{},prMode:false};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('⚠️ No se pudo guardar: almacenamiento lleno o bloqueado')}}
function commit(){FQ={};CYC={};HF={};STK={};AH=null;XP=null;persist();if(typeof paint==='function')paint();if(typeof scheduleAch==='function')scheduleAch()}

/* ---------- Analizador de capturas ---------- */
const MES={enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,setiembre:8,octubre:9,noviembre:10,diciembre:11};
const WK=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
function parseDate(n){
  const base=today();let d=null;
  if(/\bpasado manana\b/.test(n))d=addDays(base,2);
  else if(/\bhoy\b/.test(n)||/\besta noche\b/.test(n))d=base;
  else if(/\bmanana\b/.test(n)&&!/(en|por|de|a) la manana/.test(n))d=addDays(base,1);
  if(!d){const m=n.match(/\ben (\d{1,2}) dias?\b/);if(m)d=addDays(base,+m[1]);}
  if(!d){const m=n.match(/\b(\d{1,2}) de (enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)\b/);
    if(m){const t=new Date();let y=t.getFullYear();let c=new Date(y,MES[m[2]],+m[1]);if(dstr(c)<base)c=new Date(y+1,MES[m[2]],+m[1]);d=dstr(c)}}
  if(!d){const m=n.match(/\b(\d{1,2})\/(\d{1,2})\b/);if(m&&+m[1]<=31&&+m[2]<=12){const y=NOW().getFullYear();let c=new Date(y,+m[2]-1,+m[1]);if(dstr(c)<base)c=new Date(y+1,+m[2]-1,+m[1]);d=dstr(c)}}
  if(!d){const m=n.match(/\b(lunes|martes|miercoles|jueves|viernes|sabado|domingo)\b/);
    if(m){const idx=WK.indexOf(m[1]);let diff=(idx-fromStr(base).getDay()+7)%7;if(diff===0)diff=7;d=addDays(base,diff)}}
  return d;
}
function parseTime(n){
  let m=n.match(/\ba las? (\d{1,2})(?::(\d{2}))?\s*(am|pm|a\. ?m\.?|p\. ?m\.?|de la manana|de la tarde|de la noche|del dia)?/);
  if(m){let h=+m[1],mi=+(m[2]||0);const s=m[3]||'';
    if(h>23||mi>59)return null;
    if(/p/.test(s[0]||'')&&h<12)h+=12;else if(/tarde|noche/.test(s)&&h<12)h+=12;
    else if((/^a/.test(s)||/manana/.test(s))&&h===12)h=0;
    else if(!s&&h>=1&&h<=6)h+=12;
    return pad(h)+':'+pad(mi)}
  m=n.match(/\ba la una(?: y media)?\b/);if(m)return /media/.test(m[0])?'13:30':'13:00';
  if(/\bmediodia\b/.test(n))return '12:00';
  m=n.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);if(m)return pad(+m[1])+':'+m[2];
  return null;
}
const AREA_RX={
 'Trabajo':/(trabajo|asesor|agente|campana|informe|coomeva|reunion de equipo|capacitacion|formacion|llamadas?|ocupacion|asistencia|jefe|cliente|ventas|cobranza|infografia|correo|presentacion)/,
 'Casa':/(casa|hogar|aseo|limpiar|lavar|cocina|mercado|supermercado|arreglar|plomer|electrodomestico|ropa|orden|mueble|jardin)/,
 'Familia':/(familia|familiar|abuel|tio|tia|primo|cunad|suegr|hermano|hermana|reunion familiar)/,
 'Pareja':/(pareja|novia|novio|esposa|esposo|aniversario|cita romantica|salida con mi)/,
 'Ser papá':/(hijo|hija|hijos|hijas|colegio|tarea de|reunion de padres|pediatra|mi nina|mi nino|cumpleanos de)/,
 'Personal':/(gimnasio|peluquer|cita medica|medico|salud|estudio|universidad|clase|parcial|examen|dentista|curso|leer|lectura|personal|manicure|pedicure|barber)/,
 'Ocio':/(ocio|descansar|jugar|videojuego|tft|teamfight|partido|futbol|pelicula|serie|musica|fiesta|salir)/,
 'Viajes':/(viaje|viajar|paseo|vuelo|tiquete|hotel|reserva|vacaciones|maleta|pasaporte|ruta)/,
 'Ser hijo':/(mi mama|mi madre|mi papa|mi padre|mama|papa de|mis padres|visitar a mi)/
};
const TASK_RX=/(debo|tengo que|toca|hay que|necesito|recordar|recuerdame|acordarme|comprar|llamar|enviar|pagar|revisar|preparar|organizar|agendar|hacer|terminar|entregar|reservar|buscar|pedir|renovar|cobrar|escribir|imprimir|arreglar|lavar|limpiar|programar|mandar|sacar|llevar|recoger|cambiar|actualizar|elaborar|crear|diseñar|disenar)/;
const EV_RX=/(reunion|cita|evento|cumpleanos|fiesta|concierto|matricula|examen|partido|vuelo|cena|almuerzo con|celebracion|graduacion|sesion|capacitacion|clase|junta|entrevista|video ?llamada)/;
const HAB_RX=/(todos los dias|cada dia|diariamente|cada manana|cada noche|habito|cada semana|cada lunes|cada martes|cada miercoles|cada jueves|cada viernes|cada sabado|cada domingo)/;
const PRJ_RX=/(nuevo proyecto|proyecto nuevo|quiero crear un proyecto|quiero empezar un proyecto|mi meta|meta de|a futuro quiero|quiero lograr)/;
const CONS_RX=/(urgente|importante|vence|vencimiento|entrega|multa|cobro|jefe|cliente|demanda|plazo|pagar|factura|medico|colegio|no se me puede olvidar|sin falta|prioridad)/;
function matchProject(n){
  let best=null,bs=0;
  for(const p of db.projects.filter(p=>!p.archived)){
    const w=norm(p.name).split(/[^a-z0-9]+/).filter(x=>x.length>3);if(!w.length)continue;
    const hit=w.filter(x=>n.includes(x)).length,sc=hit/w.length;
    if(hit>0&&sc>=0.5&&sc>bs){bs=sc;best=p}
  }
  return best;
}
function prioInfo(it){
  let s=0;const r=[];
  if(it.date){const df=daysBetween(today(),it.date);
    if(df<0){s+=45;r.push('está vencida')}
    else if(df===0){s+=40;r.push('vence hoy')}
    else if(df<=2){s+=25;r.push('la fecha se acerca')}
    else if(df<=7)s+=8}
  const p=it.project&&db.projects.find(x=>x.id===it.project);
  if(p&&p.dailyAction){s+=25;r.push('es de un proyecto que avanza a diario')}
  if(it.projectDaily){s+=30}
  if(CONS_RX.test(norm(it.text))){s+=25;r.push('puede traer consecuencias si no se hace')}
  return {score:s,reasons:r,label:s>=50?'Alta':'Normal'};
}
function rank(it){const pi=prioInfo(it);if(it.prioManual){return (it.priority==='Alta'?1000:it.priority==='Baja'?-10:0)+pi.score}return pi.score}
function analyze(text){
  const n=norm(text),date=parseDate(n),time=parseTime(n),proj=matchProject(n);
  let areas=Object.keys(AREA_RX).filter(a=>AREA_RX[a].test(n));
  if(!areas.length&&proj&&proj.areas&&proj.areas.length)areas=proj.areas.slice();
  if(!areas.length)areas=['Personal'];
  let type='Nota';
  if(HAB_RX.test(n))type='Hábito';
  else if(PRJ_RX.test(n))type='Proyecto';
  else if((time||date)&&(EV_RX.test(n)||(time&&!TASK_RX.test(n))))type='Evento';
  else if(TASK_RX.test(n)||date)type='Tarea';
  const tmp={text,date:date||'',project:proj?proj.id:''};
  const pi=prioInfo(tmp);
  return {type,areas,date:date||'',time:time||'',project:tmp.project,priority:pi.label,reasons:pi.reasons};
}

const H=[
{id:'wake',name:'Levantarme',kind:'time',block:'Mañana',dt:['wd'],t:{wd:T('05:38','05:55')}},

/* ---------- Calendario: festivos de Colombia (Ley 51 de 1983) ---------- */
const HOL={};
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function coHolidays(y){
  if(HOL[y])return HOL[y];
  const E=easter(y),mon=d=>{d=new Date(d);while(d.getDay()!==1)d.setDate(d.getDate()+1);return d},add=(d,n)=>{d=new Date(d);d.setDate(d.getDate()+n);return d};
  const L=[[new Date(y,0,1),'Año Nuevo'],[mon(new Date(y,0,6)),'Reyes Magos'],[mon(new Date(y,2,19)),'San José'],[add(E,-3),'Jueves Santo'],[add(E,-2),'Viernes Santo'],[new Date(y,4,1),'Día del Trabajo'],[mon(add(E,39)),'Ascensión del Señor'],[mon(add(E,60)),'Corpus Christi'],[mon(add(E,68)),'Sagrado Corazón'],[mon(new Date(y,5,29)),'San Pedro y San Pablo'],[new Date(y,6,20),'Independencia'],[new Date(y,7,7),'Batalla de Boyacá'],[mon(new Date(y,7,15)),'Asunción de la Virgen'],[mon(new Date(y,9,12)),'Día de la Raza'],[mon(new Date(y,10,1)),'Todos los Santos'],[mon(new Date(y,10,11)),'Independencia de Cartagena'],[new Date(y,11,8),'Inmaculada Concepción'],[new Date(y,11,25),'Navidad']];
  const m={};L.forEach(x=>m[dstr(x[0])]=x[1]);return HOL[y]=m;
}
const holidayName=ds=>coHolidays(+ds.slice(0,4))[ds]||'';
function isLastSaturday(d){const n=new Date(d.getTime());n.setDate(n.getDate()+7);return n.getMonth()!==d.getMonth()}

function ensureCicloAnchor(){

function cicloIdx(ds){

const DT_ALL=['wd','satW','satF','sun'],DT_SHORT={wd:'L-V',satW:'Sáb. con trabajo',satF:'Sáb. libre',sun:'Dom./festivos/vac.'};

  (db.custom||[]).forEach(c=>{(c.dts&&c.dts.length?c.dts:DT_ALL).forEach(d=>{const o=customInst(c,d);
    let i=-1;if(c.after){for(let k=list.length-1;k>=0;k--){if(list[k].dt.includes(d)&&list[k].name===c.after){i=k;break}}}
    if(i<0&&c.block){for(let k=list.length-1;k>=0;k--){if(list[k].dt.includes(d)&&list[k].block===c.block){i=k;break}}}
    if(i<0)list.push(o);else{if(!c.after&&!c.block)list.push(o);else{o.block=list[i].block;if(list[i].night&&(d==='wd'||d==='sun'))o.night=true;list.splice(i+1,0,o)}}})});
  return AH=list;

function pendVisible(key,ds){const p=(db.pend||{})[key];if(!p)return false;return isRealSunday(ds)&&p.from<ds&&(!p.cleared||p.cleared===ds)}
/* Hábitos con frecuencia (p. ej. uñas cada 7 días) */
let FQ={};
function lastDoneName(name,before){const k=name+'|'+before;if(FQ[k]!==undefined)return FQ[k];const ids=H.filter(x=>x.name===name).map(x=>x.id);let r='';
  for(const d of Object.keys(db.logs).filter(x=>x<before).sort().reverse()){const L=db.logs[d];if(ids.some(id=>L[id]&&(L[id].end||L[id].done||L[id].t)&&!L[id].skip&&!L[id].na)){r=d;break}}return FQ[k]=r}
function freqVisible(h,ds){if(logOf(h.id,ds))return true;const last=lastDoneName(h.name,ds);return !last||daysBetween(last,ds)>=h.every}
function habitsFor(dt,ds){
  ds=ds||today();const d=fromStr(ds);
  return allHabits().filter(h=>{
    if(!h.dt.includes(dt))return false;
    if(h.fridayOnly&&d.getDay()!==5)return false;
    if(h.id==='crecimiento'&&cicloIdx(ds)===4)return false;
    if(h.id==='prepar'){const n=nextWD(ds);if(n&&cicloIdx(n)===4)return false}
    if(!h.custom&&(db.hidden||[]).includes(h.name))return false;
    if(h.every&&!freqVisible(h,ds))return false;
    if(h.pend)return pendVisible(h.pend,ds);
    return true;
  });
}
function hp(h,dt){const o=db.hOver;let ideal,limit;if(h.t&&h.t[dt]){ideal=(o[h.id+'|'+dt]||{}).ideal||h.t[dt][0];limit=(o[h.id+'|'+dt]||{}).limit||h.t[dt][1]}
  const mn=(o[h.id]||{}).min;return {ideal,limit,min:mn!=null?mn:h.min,max:h.max}}

function setLog(id,v,date){date=date||today();db.logs[date]=db.logs[date]||{};db.logs[date][id]=v}
function delLog(id,date){const l=db.logs[date||today()];if(l)delete l[id]}
/* estado: ok · late (fuera de tiempo) · skip (no lo hice) · na (no aplica) · run (en curso) · null (sin registrar) */
function hState(h,ds,dt){
  ds=ds||today();const l=logOf(h.id,ds);
  if(!l){if(db.minDays&&db.minDays[ds]&&!isEssential(h))return 'na';return null}
  if(l.na)return 'na';if(l.skip)return 'skip';
  if(h.kind==='time'){if(!l.t)return null;const p=hp(h,dt||dtOf(ds)),sc=scoreTime(l.t,p.ideal,p.limit);return sc===100?'ok':sc>0?'late':'miss'}
  if(h.kind==='timer'){if(!l.end)return l.start?'run':null;if(l.ok!=null)return l.ok?'ok':'late';const pl=hp(h,dt||dtOf(ds)).min*60;return (h.minGoal?l.sec>=pl:l.sec<=pl)?'ok':'late'}
  return l.done?'ok':null;

const RESOLVED={ok:1,late:1,skip:1,miss:1,na:1};
const ESS_RX=/^(levantarme|bañarme — mañana|cepillarme — mañana|cepillarme|cepillado|cepillado final|inicio gym|llegar al trabajo|tiempo familia|dormir)$/i;
const isEssential=h=>ESS_RX.test(h.name);
const isResolved=(h,ds)=>!!RESOLVED[hState(h,ds)];
const fmt12=t=>{if(!t)return '';let[a,b]=t.split(':').map(Number);const s=a>=12?'p. m.':'a. m.';a=a%12||12;return a+':'+pad(b)+' '+s};
function nowMin(){const n=NOW();let m=n.getHours()*60+n.getMinutes();if(dstr(n)!==today())m+=1440;return m}
/* Regla B: hasta el límite = cumplido (100 %). Después baja 2 % por minuto (naranja). Desde 50 min tarde = 0 % (rojo). */
const adjMin=(t,ideal)=>{let a=toMin(t);if(toMin(ideal)>=18*60&&a<6*60)a+=1440;return a};
function scoreTime(t,ideal,limit){const a=adjMin(t,ideal),l=toMin(limit);if(a<=l)return 100;return Math.max(0,100-2*(a-l))}
function afterWorkLocked(h){if(!h.afterWork)return '';const l=logOf('workin');if(l&&(l.t||l.skip||l.na))return '';return 'Se habilita al registrar «Llegar al trabajo»'}

  const base=hs.length-na;return {ok,late,skip,na,total:hs.length,base,pct:base?Math.round(ok*100/base):0,resolved:ok+late+skip+na};
}

function streakInfo(h){
  if(STK[h.id])return STK[h.id];
  const t=today(),s0=hState(h,t);let n=s0==='ok'?1:0,key=false,first=true;
  for(let k=1;k<=200;k++){const d=addDays(t,-k);if(d<'2026-01-01')break;const f=hfSet(d);if(!f.ids.has(h.id)||!usedDay(d))continue;
    const s=hState(h,d,f.dt);if(s==='na')continue;

}

function suggestTop3(skip){
  skip=skip||[];const t=today(),taken=new Set((db.top3v2||[]).map(x=>x.ref));
  const c=db.items.filter(i=>i.status==='active'&&(i.type==='Tarea'||i.type==='Evento')&&!i.projectDaily&&!i.deleg&&!taken.has(i.id)&&!skip.includes(i.id)&&i.date&&i.date<=addDays(t,2));
  return c.map(i=>{let sc=rank(i);const r=[];
    if(i.date&&i.date<t){const n=daysBetween(i.date,t);sc+=Math.min(30,n*3);r.push('atrasada '+n+(n===1?' día':' días'))}
    else if(i.date===t)r.push('es para hoy');else if(i.date)r.push('vence '+(i.date===addDays(t,1)?'mañana':ymd(i.date)));
    const p=i.project&&db.projects.find(x=>x.id===i.project);if(p&&p.dueDate&&daysBetween(t,p.dueDate)<=14){sc+=20;r.push('proyecto con meta el '+ymd(p.dueDate))}
    if((i.prioManual&&i.priority==='Alta'))r.push('prioridad alta');else if(CONS_RX.test(norm(i.text)))r.push('puede traer consecuencias');
    if(!r.length)r.push('pendiente activa');return {i,sc,why:r.slice(0,2).join(' · ')}}).sort((a,b)=>b.sc-a.sc);
}

let audioCtx=null;
function beep(f){if(!db.settings.sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=f||880;g.gain.value=.08;o.start();o.stop(audioCtx.currentTime+.18)}catch(e){}}
function toast(msg,opt){
  opt=opt||{};const box=document.getElementById('toasts');if(!box)return;
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  if(opt.undo){const b=document.createElement('button');b.textContent='Deshacer';b.onclick=()=>{opt.undo();el.remove()};el.appendChild(b)}
  while(box.children.length>=2)box.firstChild.remove();
  box.appendChild(el);setTimeout(()=>el.remove(),opt.ms||5000);
}
async function notify(title,body,tag,url,actions){
  if(!ui.focus){toast(title+(body?' · '+body.split('\n')[0]:''),{ms:6000});beep()}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  try{
    if(typeof Notification!=='undefined'&&Notification.permission==='granted'&&navigator.serviceWorker){
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg)await reg.showNotification(title,{body,tag:tag||undefined,icon:'icon-192.png',badge:'icon-192.png',vibrate:[200,100,200],renotify:!!tag,data:{url:url||'./'},actions:actions||[]});
    }
  }catch(e){}
}

function runSchedule(){
  const d=today(),m=nowMin();let ch=false;
  slots().forEach(s=>{
    const key=d+'|'+s.id,a=toMin(s.at);
    if(db.fired[key]||m<a||m>a+s.win)return;
    if(s.cond&&!s.cond())return;

    const c=s.build?s.build():s;notify(c.title,c.body,s.id,c.url,s.actions);
  });
  Object.keys(db.fired).forEach(k=>{if(k.slice(0,10)<addDays(d,-3)){delete db.fired[k];ch=true}});
  if(ch)persist();

const dayLimit=()=>Math.max(1,+db.settings.dayLimit||5);
function loadPool(){const t3=new Set((db.top3v2||[]).map(x=>x.ref));return db.items.filter(i=>i.status==='active'&&i.type==='Tarea'&&!i.projectDaily&&!t3.has(i.id)&&i.date&&!i.deleg)}
function dayLoad(d){return loadPool().filter(i=>i.date===d).length}
function overloadedDays(){const L=dayLimit(),c={};loadPool().forEach(i=>{if(i.date>=today()&&i.date<=addDays(today(),13))c[i.date]=(c[i.date]||0)+1});return Object.keys(c).sort().filter(d=>c[d]>L).map(d=>({d,n:c[d]}))}
function spreadPlan(){
  const L=dayLimit(),t=today(),pool=loadPool().filter(i=>i.date>=t),byRank=(a,b)=>rank(b)-rank(a)||(a.created||0)-(b.created||0);
  const last=pool.reduce((m,i)=>i.date>m?i.date:m,t);let carry=[];const moves=[];
  for(let k=0;k<400;k++){const d=addDays(t,k);if(d>last&&!carry.length)break;
    const orig=pool.filter(i=>i.date===d).sort(byRank);
    if(orig.length>L){carry=carry.concat(orig.slice(L)).sort(byRank)}
    else if(k>0&&isWD(d)&&carry.length){carry.splice(0,L-orig.length).forEach(i=>moves.push({i,from:i.date,to:d}))}
  }
  return moves;
}

  const short=m=>{m=((Math.round(m)%1440)+1440)%1440;return (Math.floor(m/60)%12||12)+':'+pad(m%60)};
  const tsMin=ms=>{const d=new Date(ms);return d.getHours()*60+d.getMinutes()};
  const inB=U.filter(u=>u.block===cu.block);
  let h='<section class="card tl"><div class="small tlh">Siguiente en tu rutina · <b>'+esc(cu.block)+'</b> · paso '+(inB.indexOf(cu)+1)+' de '+inB.length+'</div>';
  U.slice(Math.max(0,i-2),i).forEach(u=>{const st=uState(u);let m;if(u.g){const G=((db.grpLog||{})[today()]||{})[u.g.id]||{},le=u.members.map(x=>logOf(x.id)||{});m=tsMin(G.end||Math.max(...le.map(l=>l.end||l.at||0))||Date.now())}else{const l=logOf(u.h.id)||{};m=l.t?toMin(l.t):tsMin(l.end||l.at||Date.now())}

  const w=!cu.g&&waitFrom(cur);let start;

    t=m+(u.g?gPlan(u,dt):(u.h.kind==='timer'?(+hp(u.h,dt).min||0):0))});

/* ---------- Revisión semanal ---------- */
function weekReport(){
  const days=[];for(let k=6;k>=0;k--)days.push(addDays(today(),-k));
  const hab={},fails=[];let T={ok:0,late:0,skip:0,na:0,none:0,total:0};
  days.forEach(d=>{const dt=dtOf(d);habitsFor(dt,d).forEach(h=>{
    const nm=h.id==='crecimiento'?'Actividad de crecimiento':h.name;
    const r=hab[nm]=hab[nm]||{name:nm,ok:0,late:0,skip:0,na:0,none:0,n:0,over:0};
    const st=hState(h,d,dt),l=logOf(h.id,d);
    if(d===today()&&!RESOLVED[st])return;
    r.n++;T.total++;
    if(st==='ok'){r.ok++;T.ok++}else if(st==='late'){r.late++;T.late++}else if(st==='skip'||st==='miss'){r.skip++;T.skip++}else if(st==='na'){r.na++;T.na++}else{r.none++;T.none++}
    if(h.kind==='timer'&&l&&l.end)r.over+=Math.max(0,l.sec-hp(h,dt).min*60);
    if(st==='late'||st==='skip'||st==='miss')fails.push({d,name:hName(h,d),msg:l.msg||(st==='skip'?'No lo hiciste.':'Fuera de tiempo.'),why:l.why||''});
    if(!st&&d<today())fails.push({d,name:hName(h,d),msg:'Sin registrar.'});
  })});
  const t0=fromStr(days[0]).getTime();
  const doneT=db.items.filter(i=>i.status==='done'&&i.doneAt>=t0&&!i.note);
  const t3=(db.top3log||[]).filter(x=>x.date>=days[0]);
  const whyC={};fails.forEach(f=>{if(f.why)whyC[f.why]=(whyC[f.why]||0)+1});
  const sleeps=days.map(d=>{const L=db.logs[d]||{},sid=Object.keys(L).find(k=>/sleep$/.test(k)&&L[k].t);return sid?{d,m:sleepMinutes(L[sid].t,d)}:null}).filter(x=>x&&x.m>0);
  const minD=days.filter(d=>(db.minDays||{})[d]).length;
  const dia=days.map(d=>({d,x:(db.diary||{})[d]})).filter(o=>o.x&&o.x.mood);
  const ppl=(db.people||[]).map(p=>({p,n:((db.peopleLog||{})[p.id]||[]).filter(d=>d>=days[0]).length}));
  return {days,hab,fails,T,doneT,t3,whyC,sleeps,minD,dia,ppl,late:tasks().filter(i=>i.date&&i.date<today()).length,
    inbox:db.items.filter(i=>i.status==='inbox').length,
    areas:AREAS.map(a=>({a,done:doneT.filter(i=>(i.areas||[]).includes(a)).length,pend:tasks().filter(i=>(i.areas||[]).includes(a)).length})),
    projects:db.projects.filter(p=>!p.archived).map(p=>({p,s:projStats(p)}))};
}

let XP=null,achT=0;
const LVL_NAMES=['Inicio','Arrancando','En marcha','Constante','Disciplinado','Enfocado','Imparable','Ejemplo','Maestro del hábito','Leyenda'];
const lvlNeed=n=>250*n*(n-1);
function xpCalc(){
  if(XP!=null)return XP;const map={};allHabits().forEach(h=>{(map[h.id]=map[h.id]||[]).push(h)});let xp=0;
  Object.keys(db.logs).forEach(d=>{const L=db.logs[d],dt=dtOf(d);Object.keys(L).forEach(id=>{const hs=map[id];if(!hs||!L[id])return;const h=hs.find(x=>x.dt.includes(dt))||hs[0],st=hState(h,d,dt);xp+=st==='ok'?10:st==='late'?4:0})});
  xp+=(db.top3log||[]).filter(x=>x.res==='done').length*30+db.weekly.filter(w=>w.end).length*100+Object.keys(db.gymLog||{}).filter(gymAttended).length*20+Object.values(db.diary||{}).filter(x=>x&&x.mood).length*10;
  return XP=xp;
}
function lvlInfo(){const xp=xpCalc();let n=1;while(xp>=lvlNeed(n+1))n++;const a=lvlNeed(n),b=lvlNeed(n+1);return {n,xp,name:LVL_NAMES[Math.min(n,LVL_NAMES.length)-1]+(n>LVL_NAMES.length?' '+(n-LVL_NAMES.length+1):''),pct:Math.round((xp-a)*100/(b-a)),left:b-xp}}
function logDays(){return Object.keys(db.logs).filter(d=>Object.keys(db.logs[d]).length).sort()}
function runMax(fn){let best=0,cur=0;logDays().forEach(d=>{const v=fn(d);if(v===null)return;if(v){cur++;best=Math.max(best,cur)}else cur=0});return best}
function kindOk(d,rx){const L=db.logs[d]||{},k=Object.keys(L).find(x=>rx.test(x));if(!k)return false;const h=allHabits().find(x=>x.id===k);return h?hState(h,d,dtOf(d))==='ok':false}

  return {pct,d80:d80.length,wk80:Math.max(0,...Object.values(wk80)),gym:gd.length,cyc:Object.values(ws).filter(s=>s.size>=3).length,cycMax:Math.max(0,...Object.values(ws).map(s=>s.size)),best:db.cnt.best||0,

const CH={W:340,H:150,L:34,R:10,T:12,B:24};

function lineChart(o){
  /* o: {labels:[], series:[{name,cls,vals:[]}], min,max, fy, tip(i,s,v)} */
  const n=o.labels.length,pw=CH.W-CH.L-CH.R,ph=CH.H-CH.T-CH.B,X=i=>CH.L+(n<=1?pw/2:pw*i/(n-1)),Y=v=>CH.T+ph*(1-(v-o.min)/((o.max-o.min)||1));
  let g='<svg viewBox="0 0 '+CH.W+' '+CH.H+'" class="chart" role="img" aria-label="'+esc(o.aria||'')+'">'+axisY(o.min,o.max,o.fy,o.ticks,o.fyAxis);
  const step=Math.max(1,Math.ceil(n/6));o.labels.forEach((l,i)=>{if(i%step===0||i===n-1)g+='<text x="'+X(i)+'" y="'+(CH.H-6)+'" class="ct" text-anchor="middle">'+esc(l)+'</text>'});
  o.series.forEach(s=>{let d='',pen=false;s.vals.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);pen=true});g+='<path d="'+d+'" class="cl '+s.cls+'"/>';
    s.vals.forEach((v,i)=>{if(v!=null)g+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="'+(n>20?2.5:4)+'" class="cd '+s.cls+'"/>'})});

  o.labels.forEach((l,i)=>{const t=o.series.map(s=>s.vals[i]==null?null:(o.series.length>1?s.name+': ':'')+o.fy(s.vals[i])).filter(Boolean);if(!t.length)return;const w=pw/Math.max(1,n-1);g+='<rect x="'+(X(i)-w/2)+'" y="'+CH.T+'" width="'+w+'" height="'+ph+'" class="hit"'+tipAttr((o.tipLabels?o.tipLabels[i]:l)+' · '+t.join(' · '))+'/>'});
  return g+'</svg>';

function barChart(o){
  /* o: {items:[{label,v,tip}], max, fy, cls} */
  const n=o.items.length,pw=CH.W-CH.L-CH.R,ph=CH.H-CH.T-CH.B,bw=Math.min(34,pw/n-6),max=o.max||Math.max(1,...o.items.map(x=>x.v));

  o.items.forEach((x,i)=>{const cx=CH.L+pw*(i+.5)/n,h=ph*(x.v/max),y=CH.T+ph-h;
    if(h>0)g+='<path d="M'+(cx-bw/2)+' '+(CH.T+ph)+'V'+(y+Math.min(4,h))+'q0 -4 4 -4h'+(bw-8)+'q4 0 4 4V'+(CH.T+ph)+'Z" class="cb '+(x.cls||o.cls||'s1')+'"/>';

function nextRepeat(i){const r=i.repeat,b=i.date&&i.date>=today()?i.date:today();
  if(r.type==='daily')return addDays(b,1);if(r.type==='every')return addDays(b,Math.max(1,+r.n||7));
  if(r.type==='weekly'){const ds=r.days&&r.days.length?r.days:[fromStr(b).getDay()];for(let k=1;k<=7;k++){const d=addDays(b,k);if(ds.includes(fromStr(d).getDay()))return d}return addDays(b,7)}
  if(r.type==='monthly'){const x=fromStr(i.date||b),dom=(r.dom||x.getDate());let y=x.getFullYear(),m=x.getMonth()+1;if(dstr(x)<today()){const t=fromStr(today());y=t.getFullYear();m=t.getMonth()+(t.getDate()>=dom?1:0)}const last=new Date(y,m+1,0).getDate();return dstr(new Date(y,m,Math.min(dom,last)))}
  return addDays(b,7)}

function mailDraft(){
  const t=today(),dow=fromStr(t).getDay(),mon=addDays(t,-((dow+6)%7)),fri=addDays(mon,4),nMon=addDays(mon,7),nFri=addDays(mon,11),t0=fromStr(mon).getTime();
  const done=db.items.filter(i=>i.status==='done'&&i.doneAt>=t0&&!i.note&&(i.type==='Tarea'||i.type==='Evento')&&isWork(i));
  const g={};done.forEach(i=>{const k=projName(i.project)||'Otras actividades';(g[k]=g[k]||[]).push(i.text)});
  const act=db.items.filter(i=>i.status==='active'&&(i.type==='Tarea'||i.type==='Evento')&&isWork(i)&&!i.projectDaily);
  const cur=act.filter(i=>i.date&&i.date<=fri).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,12);
  const nxt=act.filter(i=>i.date&&i.date>=nMon&&i.date<=nFri).sort((a,b)=>a.date.localeCompare(b.date));
  top3Active().forEach(x=>{const it=x.kind==='item'&&db.items.find(i=>i.id===x.ref);if(it&&isWork(it)&&!nxt.includes(it)&&!cur.includes(it))nxt.unshift(it)});
  const L=['Hola,','','Comparto cómo vamos esta semana ('+ymd(mon)+' al '+ymd(fri)+'):','','LOGROS DE LA SEMANA'];

}

const durTxt=s=>{s=Math.round(s);const m=Math.floor(s/60),x=s%60;return x?m+' min '+x+' s':m+' minutos'};
function logTime(h,t){
  if(!h||!t)return;const dt=dayType(),p=hp(h,dt),sc=scoreTime(t,p.ideal,p.limit),ok=sc===100,key=streakInfo(h).key,sleep=/^dormir$/i.test(h.name);
  const verb=sleep?'Te acostaste':/levantarme/i.test(h.name)?'Te levantaste':/salir/i.test(h.name)?'Saliste':'Llegaste';
  const late=adjMin(t,p.ideal)-toMin(p.limit);
  const msg=verb+' a las '+fmt12(t)+' (ideal '+fmt12(p.ideal)+', límite '+fmt12(p.limit)+')'+(late>0?': '+late+' min tarde · cumplimiento '+sc+' %.':'.');
  const sl=sleep?sleepMinutes(t):0,sleepTxt=sl>0?' Dormirás '+hmTxt(sl)+'.':'';
  setLog(h.id,{t,score:sc,ok,msg:ok?'':msg,at:Date.now()});commit();
  if(ok)celebrate('ok',key?'¡Recuperaste la racha!':'',(key?'Ayer fallaste y hoy cumpliste. Nunca falles dos veces 💪 ':'')+(sleep?'¡A descansar!'+sleepTxt:msg));
  else celebrate(sc>0?'late':'bad',sc>0?'Fuera de tiempo':'No cumplido',msg+sleepTxt,{h});
}

  if(tk%10===0){
    if(lastDay!==today()){lastDay=today();CYC={};ensureDaily();paint()}
    const m=nowMin();if(ui.tab==='hoy'&&m!==lastMin&&!document.querySelector('#view input:focus,#view textarea:focus,#view select:focus')){const gate=['09:00','11:45','17:00'].some(x=>toMin(x)===m);if(gate)paint()}lastMin=m;
    checkOvertime();runSchedule();
  }
}
function migrate(){
  db.vacations=db.vacations||{};db.pend=db.pend||{};db.top3log=db.top3log||[];
  if(!db.vacSeed){let c='2026-11-03';while(c<='2026-11-10'){db.vacations[c]=true;c=addDays(c,1)}db.vacSeed=1}
  if(!db.custToTask){(db.custom||[]).filter(c=>!c.dts).forEach(c=>{const s=analyze(c.name);db.items.unshift({id:uid(),text:c.name,src:'hábito',created:Date.now(),status:'inbox',sug:s,type:'Tarea',areas:s.areas.slice(),priority:s.priority,prioManual:false,date:'',time:'',project:s.project,sec:0,tStart:0})});db.custom=(db.custom||[]).filter(c=>c.dts);db.custToTask=1}
  if(!db.parejaV){db.parejaV=1;db.people=db.people||[];if(!db.people.some(p=>/pareja|novia|esposa/i.test(p.name+' '+(p.action||''))))db.people.push({id:'p'+uid(),name:'Mi pareja',action:'salida',every:15,created:db.outing||today()});if(db.outing){const p=db.people.find(x=>x.name==='Mi pareja');if(p){db.peopleLog=db.peopleLog||{};db.peopleLog[p.id]=[db.outing]}}}
  AH=null;CYC={};ensureCicloAnchor();top3Migrate();gymInit();
}
function init(){
  migrate();lastDay=today();ensureDaily();persist();setTimeout(checkAch,1500);
  document.addEventListener('click',e=>{
    if(e.target.closest('#fx')){const wb=e.target.closest('[data-why]');if(wb){setWhy(wb.dataset.why);return}closeFx();return}
    const m=document.getElementById('modal');if(e.target===m){closeModal();return}
    const tipEl=e.target.closest('[data-tip]');if(tipEl)showTip(tipEl,e.clientX,e.clientY);
    const b=e.target.closest('[data-act]');if(!b)return;
    const f=ACT[b.dataset.act];if(f)f(b.dataset,b);
  });
  document.addEventListener('change',e=>{
    if(e.target.closest('#top3pick')){top3PickerSync();return}
    const el=e.target.closest('[data-chg]');if(el&&CHG[el.dataset.chg])CHG[el.dataset.chg](el)});
  document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const t=e.target.closest&&e.target.closest('.chart [data-tip]');if(t)showTip(t,e.clientX,e.clientY)});
  document.addEventListener('input',e=>{
    if(e.target.id==='sq'){document.getElementById('sr').innerHTML=searchHTML(e.target.value)}
    if(e.target.id==='t3q'){const q=norm(e.target.value);document.querySelectorAll('#top3pick label').forEach(l=>{l.style.display=norm(l.textContent).includes(q)?'':'none'})}
  });
  document.getElementById('restoreInput').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)restoreFile(f);setTimeout(()=>{e.target.value=''},500)});
  document.getElementById('navmic').addEventListener('click',()=>{if(document.getElementById('capt')){startVoice();return}openCapture(true)});
  document.querySelectorAll('#nav button[data-tab]').forEach(b=>b.addEventListener('click',()=>{ui.tab=b.dataset.tab==='org'?(ui.lastOrg||'capturas'):b.dataset.tab;ui.prMode=false;paint();window.scrollTo(0,0)}));
  document.getElementById('srch').addEventListener('click',()=>ACT.search());
  const hash=(location.hash||'').replace('#','');if(VIEWS[hash])ui.tab=hash;
  paint();
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(ui.tab==='mas')paint()});
  window.addEventListener('appinstalled',()=>{installEvt=null;toast('App instalada ✓ Búscala en tu pantalla de inicio.')});
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='go'){const h=(e.data.url||'').split('#')[1];if(VIEWS[h]){ui.tab=h;paint()}}});
  }
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(lastDay!==today()){lastDay=today();CYC={}}ensureDaily();runSchedule();paint()}});
  setInterval(tick,1000);setTimeout(runSchedule,1500);
}
if(typeof document!=='undefined'&&document.getElementById&&document.getElementById('view')&&!globalThis.__TEST__)init();
